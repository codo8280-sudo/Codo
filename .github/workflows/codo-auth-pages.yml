name: CODO staging OAuth Pages

on:
  push:
    branches:
      - feat/staging-runtime-oidc
    paths:
      - 'oauth_web/**'
      - '.github/workflows/codo-auth-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: codo-staging-oauth-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static OAuth UI
        uses: actions/upload-pages-artifact@v4
        with:
          path: oauth_web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
